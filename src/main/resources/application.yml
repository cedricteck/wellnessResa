resa:
  base-url: https://wellnesssportclub.resamania.fr
  timezone: Europe/Paris

  # Constantes propres à ton club / ton compte (relevées dans la capture HAR).
  supplier-id: 103
  data-pool-id: 8989
  customer-id: 5880238        # TON identifiant client de réservation
                              # (distinct du userId de connexion — c'est normal)

  # L'ouverture des réservations se fait J-N exactement à l'HEURE DE DÉBUT du cours
  # (et non à minuit). Ex. : cours lundi 19:15 -> ouverture vendredi 19:15.
  booking-opens-days-before: 3
  retry-window-seconds: 180   # durée des tentatives APRÈS l'instant d'ouverture
  retry-interval-ms: 2000     # délai entre deux tentatives
  pre-open-lead-seconds: 30   # on se connecte ce délai AVANT l'ouverture, prêt à dégainer

  # Identifiants fournis par variables d'environnement (jamais en dur ici).
  email: ${RESA_EMAIL:yash0302@hotmail.com}
  password: ${RESA_PASSWORD:Jedi17112021!}

  # Ton planning souhaité. Jours en MAJUSCULES (MONDAY..SUNDAY).
  # - time        : heure de début exacte du cours "HH:MM" (heure locale)
  # - label       : NOM du cours tel qu'il apparaît dans le planning. C'est LUI qui
  #                 départage deux cours à la même heure (comparaison insensible à la
  #                 casse/aux espaces). Un --dry-run te liste les noms exacts disponibles.
  # - activity-id : OPTIONNEL (0 ou absent = ignoré). Filtre additionnel ; à éviter car
  #                 l'activityId n'est pas stable d'une semaine à l'autre — préfère le label.
  schedule:
    WEDNESDAY:
      - time: "12:30"
        label: "Aquabiking Gambetta"
    THURSDAY:
      - time: "17:30"
        label: "Aquabiking Gambetta"

# Application sans serveur web : on n'expose aucune API HTTP.
spring:
  main:
    web-application-type: none

logging:
  level:
    com.wsc.resabot: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{0} - %msg%n"

name: Resa Bot
version: "1.0.4"
slug: resa_bot
description: Réservation automatique des cours Wellness Sport Club (Resamania / DWR)
url: https://github.com/cedricteck/wellnessResa/tree/master/resa_bot

# N'ajoute une architecture ici QUE si l'image correspondante est publiée
# (resa_bot/publish.sh aarch64), sinon le Supervisor cherchera une image inexistante.
arch:
  - amd64

# Image préconstruite : la machine Home Assistant ne compile plus rien, elle tire
# cette image au tag égal à "version" ci-dessus. {arch} est remplacé par le
# Supervisor. Publication : resa_bot/publish.sh
image: ghcr.io/cedricteck/resa-bot-{arch}

# s6-overlay est fourni par l'image de base : on désactive l'init de Docker.
init: false
boot: auto
startup: application

# L'IHM s'affiche dans la barre latérale, authentifiée par Home Assistant.
# Aucun port n'est publié : l'interface n'est PAS joignable depuis le réseau local,
# uniquement à travers Home Assistant.
ingress: true
ingress_port: 8080
panel_icon: mdi:calendar-check
panel_title: Resa Bot

# Le planning édité depuis l'IHM vit dans /data/schedule.json, que le Supervisor
# persiste et inclut dans les sauvegardes Home Assistant. Aucun "map" nécessaire.

options:
  email: ""
  password: ""
  timezone: Europe/Paris
  booking_opens_days_before: 3
  retry_window_seconds: 180
  retry_interval_ms: 2000
  pre_open_lead_seconds: 30
  log_level: info

schema:
  email: email
  password: password
  timezone: str
  booking_opens_days_before: int(0,14)
  retry_window_seconds: int(1,3600)
  retry_interval_ms: int(200,60000)
  pre_open_lead_seconds: int(0,600)
  log_level: list(trace|debug|info|warn|error)

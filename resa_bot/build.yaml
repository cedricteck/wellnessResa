# Image de base par architecture. On prend la variante Debian : le paquet
# openjdk-17-jre-headless y est disponible tel quel, contrairement à Alpine où
# le nom et le dépôt du JRE varient selon les versions.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
